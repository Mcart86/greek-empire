<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Content Review — Greek Empire Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --black:   #0D0D0D;
      --dark:    #141414;
      --card:    #1A1A1A;
      --card2:   #1F1F1F;
      --border:  #2A2A2A;
      --gold:    #C9A84C;
      --gold-lt: #E8B830;
      --cream:   #F0E8D0;
      --muted:   #555;
      --text:    #E0E0E0;
      --green:   #4caf7d;
      --red:     #e05252;
      --amber:   #e09530;
    }

    body {
      background: var(--black);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      min-height: 100vh;
    }

    /* ── Login gate ── */
    #login-gate {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }
    .login-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 40px 36px;
      width: 100%;
      max-width: 380px;
      text-align: center;
    }
    .login-box img { height: 32px; margin-bottom: 28px; }
    .login-box h2 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 28px;
      letter-spacing: 3px;
      color: var(--cream);
      margin-bottom: 6px;
    }
    .login-box p { color: var(--muted); font-size: 13px; margin-bottom: 28px; }
    .login-box input {
      width: 100%;
      background: var(--dark);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      padding: 12px 16px;
      margin-bottom: 14px;
      text-align: center;
      letter-spacing: 4px;
    }
    .login-box input:focus { outline: none; border-color: var(--gold); }
    .login-box button {
      width: 100%;
      background: var(--gold);
      color: var(--black);
      font-family: 'Bebas Neue', sans-serif;
      font-size: 17px;
      letter-spacing: 2px;
      border: none;
      border-radius: 6px;
      padding: 13px;
      cursor: pointer;
    }
    .login-box button:hover { background: var(--gold-lt); }
    .login-error { color: var(--red); font-size: 12px; margin-top: 10px; display: none; }

    /* ── App shell (hidden until login) ── */
    #app { display: none; }

    /* ── Header ── */
    header {
      border-bottom: 1px solid var(--border);
      padding: 16px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      background: var(--black);
      z-index: 10;
    }
    .header-left { display: flex; align-items: center; gap: 14px; }
    header img { height: 30px; }
    header .pipe { width: 1px; height: 24px; background: var(--border); }
    header span {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 17px;
      letter-spacing: 2px;
      color: var(--gold);
    }
    .header-right { display: flex; align-items: center; gap: 16px; }

    /* ── Filter tabs ── */
    .filter-bar {
      padding: 20px 28px 0;
      display: flex;
      align-items: center;
      gap: 6px;
      border-bottom: 1px solid var(--border);
    }
    .filter-tab {
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      color: var(--muted);
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 500;
      padding: 8px 14px 12px;
      cursor: pointer;
      transition: color 0.2s;
      white-space: nowrap;
    }
    .filter-tab:hover { color: var(--text); }
    .filter-tab.active {
      color: var(--gold);
      border-bottom-color: var(--gold);
    }
    .filter-tab .badge {
      background: var(--border);
      border-radius: 20px;
      font-size: 10px;
      padding: 1px 7px;
      margin-left: 6px;
      color: var(--muted);
    }
    .filter-tab.active .badge {
      background: rgba(201,168,76,0.15);
      color: var(--gold);
    }

    /* ── Main layout ── */
    .queue-wrap {
      max-width: 900px;
      margin: 0 auto;
      padding: 32px 24px 80px;
    }

    .queue-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }
    .queue-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 32px;
      letter-spacing: 3px;
      color: var(--cream);
    }

    /* ── Empty state ── */
    .empty-state {
      text-align: center;
      padding: 80px 20px;
      color: var(--muted);
    }
    .empty-state .icon { font-size: 36px; margin-bottom: 14px; }
    .empty-state p { font-size: 15px; }

    /* ── Loading ── */
    .loading {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
      font-size: 13px;
    }

    /* ── Submission card ── */
    .submission-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      margin-bottom: 16px;
      overflow: hidden;
      transition: border-color 0.2s;
    }
    .submission-card:hover { border-color: #333; }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      gap: 12px;
    }
    .card-meta {
      display: flex;
      align-items: center;
      gap: 14px;
      flex: 1;
      min-width: 0;
    }
    .avatar {
      width: 36px; height: 36px;
      background: linear-gradient(135deg, var(--gold) 0%, #8a5c10 100%);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 14px;
      color: var(--black);
      flex-shrink: 0;
    }
    .card-info { min-width: 0; }
    .ambassador-name {
      font-weight: 600;
      font-size: 14px;
      color: var(--cream);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .card-sub {
      font-size: 12px;
      color: var(--muted);
      margin-top: 1px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ── Text button ── */
    .btn-text {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 5px;
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 500;
      padding: 7px 14px;
      text-decoration: none;
      transition: border-color 0.15s, color 0.15s;
      cursor: pointer;
    }
    .btn-text:hover { border-color: var(--gold); color: var(--gold); }
    .btn-text-approved { border-color: rgba(76,175,125,0.4); color: var(--green); }
    .btn-text-approved:hover { border-color: var(--green); }
    .btn-text-revision { border-color: rgba(224,82,82,0.4); color: var(--red); }
    .btn-text-revision:hover { border-color: var(--red); }

    /* Status badge */
    .status-badge {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: 20px;
      flex-shrink: 0;
    }
    .status-pending  { background: rgba(224,149,48,0.15); color: var(--amber); }
    .status-approved { background: rgba(76,175,125,0.12); color: var(--green); }
    .status-revision { background: rgba(224,82,82,0.12);  color: var(--red); }

    /* Platform badge */
    .platform-tag {
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      padding: 3px 9px;
      border-radius: 4px;
      background: var(--border);
      color: var(--muted);
      flex-shrink: 0;
    }

    /* ── Card body ── */
    .card-body {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0;
    }
    @media (min-width: 640px) {
      .card-body.has-image {
        grid-template-columns: 180px 1fr;
      }
    }

    .card-image {
      border-right: 1px solid var(--border);
      overflow: hidden;
    }
    .card-image img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      display: block;
    }
    .card-image .no-img {
      width: 100%;
      height: 180px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--dark);
      color: var(--muted);
      font-size: 26px;
    }
    .video-thumb {
      width: 100%;
      height: 180px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: var(--dark);
    }
    .video-thumb span { font-size: 32px; }
    .video-thumb a {
      font-size: 12px;
      font-weight: 600;
      color: var(--gold);
      text-decoration: none;
      border: 1px solid var(--gold);
      border-radius: 4px;
      padding: 5px 12px;
      letter-spacing: 0.5px;
    }
    .video-thumb a:hover { background: rgba(201,168,76,0.1); }

    .card-content {
      padding: 20px;
    }
    .caption-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 8px;
    }
    .caption-text {
      font-size: 13px;
      line-height: 1.65;
      color: var(--text);
      white-space: pre-wrap;
      word-break: break-word;
    }
    .caption-text.truncated { 
      display: -webkit-box;
      -webkit-line-clamp: 4;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .expand-btn {
      background: none;
      border: none;
      color: var(--gold);
      font-size: 12px;
      cursor: pointer;
      padding: 6px 0 0;
      display: block;
    }

    .notes-block {
      margin-top: 14px;
      padding: 12px 14px;
      background: var(--dark);
      border-radius: 6px;
      border-left: 2px solid var(--border);
    }
    .notes-block .notes-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 4px;
    }
    .notes-block p {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.6;
    }

    /* ── Card actions ── */
    .card-actions {
      padding: 14px 20px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .timestamp {
      font-size: 11px;
      color: var(--muted);
      margin-right: auto;
    }

    .btn {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 14px;
      letter-spacing: 1.5px;
      border: none;
      border-radius: 5px;
      padding: 8px 16px;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .btn:hover { opacity: 0.85; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .btn-approve {
      background: var(--green);
      color: #000;
    }
    .btn-revision {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0;
    }
    .btn-revision:hover { border-color: var(--red); color: var(--red); opacity: 1; }
    .btn-delete {
      background: transparent;
      border: none;
      color: var(--muted);
      font-size: 16px;
      cursor: pointer;
      padding: 7px 8px;
      border-radius: 5px;
      transition: color 0.15s;
      line-height: 1;
    }
    .btn-delete:hover { color: var(--red); }

    /* ── Revision modal ── */
    #modal-overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.75);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    #modal-overlay.open { display: flex; }
    .modal {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 32px;
      width: 100%;
      max-width: 480px;
    }
    .modal h3 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 24px;
      letter-spacing: 2px;
      color: var(--cream);
      margin-bottom: 6px;
    }
    .modal p { font-size: 13px; color: var(--muted); margin-bottom: 18px; }
    .modal textarea {
      width: 100%;
      background: var(--dark);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      padding: 12px 14px;
      min-height: 110px;
      resize: vertical;
      margin-bottom: 16px;
    }
    .modal textarea:focus { outline: none; border-color: var(--gold); }
    .modal-actions { display: flex; gap: 10px; justify-content: flex-end; }
    .btn-cancel {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 500;
      border-radius: 5px;
      padding: 9px 18px;
      cursor: pointer;
    }
    .btn-send-revision {
      background: var(--red);
      color: #fff;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 15px;
      letter-spacing: 1.5px;
      border: none;
      border-radius: 5px;
      padding: 9px 20px;
      cursor: pointer;
    }

    /* ── Toast ── */
    #toast {
      position: fixed;
      bottom: 28px; left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 20px;
      font-size: 13px;
      color: var(--text);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s, transform 0.25s;
      z-index: 200;
      white-space: nowrap;
    }
    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ── Refresh btn ── */
    .btn-refresh {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 5px;
      color: var(--muted);
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      padding: 6px 12px;
      cursor: pointer;
    }
    .btn-refresh:hover { border-color: var(--gold); color: var(--gold); }
  </style>
</head>
<body>

<!-- App -->
<div id="app" style="display:block;">

  <header>
    <div class="header-left">
      <img src="greek-empire-wordmark.png" alt="Greek Empire" />
      <div class="pipe"></div>
      <span>Content Review</span>
    </div>
    <div class="header-right">
      <button class="btn-refresh" id="refresh-btn">↻ Refresh</button>
    </div>
  </header>

  <div class="filter-bar">
    <button class="filter-tab active" data-status="pending">
      Pending <span class="badge" id="badge-pending">0</span>
    </button>
    <button class="filter-tab" data-status="approved">
      Approved <span class="badge" id="badge-approved">0</span>
    </button>
    <button class="filter-tab" data-status="revision">
      Needs Revision <span class="badge" id="badge-revision">0</span>
    </button>
    <button class="filter-tab" data-status="all">
      All <span class="badge" id="badge-all">0</span>
    </button>
  </div>

  <div class="queue-wrap">
    <div class="queue-header">
      <div class="queue-title" id="queue-title">Pending Review</div>
    </div>
    <div id="submissions-list">
      <div class="loading">Loading submissions…</div>
    </div>
  </div>

</div>

<!-- Revision Modal -->
<div id="modal-overlay">
  <div class="modal">
    <h3>Request Revision</h3>
    <p>Tell the ambassador what needs to change before they post.</p>
    <textarea id="revision-notes" placeholder="e.g. Great shot — swap out the caption, lead with culture not product. Remove the price mention. Tag us @greekempire_co"></textarea>
    <div class="modal-actions">
      <button class="btn-cancel" id="modal-cancel">Cancel</button>
      <button class="btn-send-revision" id="modal-send">Send Feedback</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div id="toast"></div>

<script>
  const SUPABASE_URL = 'https://wwsjkiubkfcmpbjiqazj.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_fceq-qik0OOMdAYzHU9nIQ_0FxOILuN';
  // Auto-load on open
  loadSubmissions();

  // ── Helpers (defined early) ──
  function isVideo(url) {
    if (!url) return false;
    return /\.(mp4|mov|avi|webm|mkv)(\?|$)/i.test(url);
  }

  // ── State ──
  let allSubmissions = [];
  let currentFilter = 'pending';
  let revisionTargetId = null;

  // ── Load ──
  async function loadSubmissions() {
    document.getElementById('submissions-list').innerHTML = '<div class="loading">Loading submissions…</div>';
    try {
      const res = await fetch(
        `${SUPABASE_URL}/rest/v1/content_submissions?select=*&order=submitted_at.desc`,
        {
          headers: {
            'apikey': SUPABASE_ANON_KEY,
            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
          }
        }
      );
      if (!res.ok) throw new Error(await res.text());
      allSubmissions = await res.json();
      updateBadges();
      renderList();
    } catch (err) {
      console.error(err);
      document.getElementById('submissions-list').innerHTML =
        '<div class="empty-state"><div class="icon">⚠️</div><p>Could not load submissions.<br/>Check Supabase table setup.</p></div>';
    }
  }

  document.getElementById('refresh-btn').addEventListener('click', loadSubmissions);

  // ── Badges ──
  function updateBadges() {
    const count = s => allSubmissions.filter(x => x.status === s).length;
    document.getElementById('badge-pending').textContent  = count('pending');
    document.getElementById('badge-approved').textContent = count('approved');
    document.getElementById('badge-revision').textContent = count('revision');
    document.getElementById('badge-all').textContent      = allSubmissions.length;
  }

  // ── Filter tabs ──
  document.querySelectorAll('.filter-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      currentFilter = tab.dataset.status;
      const titles = { pending: 'Pending Review', approved: 'Approved', revision: 'Needs Revision', all: 'All Submissions' };
      document.getElementById('queue-title').textContent = titles[currentFilter];
      renderList();
    });
  });

  // ── Render ──
  function renderList() {
    const list = currentFilter === 'all'
      ? allSubmissions
      : allSubmissions.filter(s => s.status === currentFilter);

    const el = document.getElementById('submissions-list');

    if (list.length === 0) {
      const msgs = { pending: 'No posts waiting for review.', approved: 'No approved posts yet.', revision: 'No posts needing revision.', all: 'No submissions yet.' };
      el.innerHTML = `<div class="empty-state"><div class="icon">✦</div><p>${msgs[currentFilter]}</p></div>`;
      return;
    }

    el.innerHTML = list.map(s => cardHTML(s)).join('');

    // Expand/collapse captions
    el.querySelectorAll('.expand-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const cap = btn.previousElementSibling;
        if (cap.classList.contains('truncated')) {
          cap.classList.remove('truncated');
          btn.textContent = 'Show less';
        } else {
          cap.classList.add('truncated');
          btn.textContent = 'Show full caption →';
        }
      });
    });

    // Approve buttons
    el.querySelectorAll('.btn-approve').forEach(btn => {
      btn.addEventListener('click', () => updateStatus(btn.dataset.id, 'approved'));
    });

    // Revision buttons
    el.querySelectorAll('.btn-revision').forEach(btn => {
      btn.addEventListener('click', () => openRevisionModal(btn.dataset.id));
    });

    // Delete buttons
    el.querySelectorAll('.btn-delete').forEach(btn => {
      btn.addEventListener('click', () => deleteSubmission(btn.dataset.id));
    });
  }

  function cardHTML(s) {
    const initials = (s.ambassador_name || 'A').split(' ').map(w => w[0]).join('').toUpperCase().slice(0,2);
    const platform = formatPlatform(s.platform);
    const time     = formatTime(s.submitted_at);
    const hasImg   = !!s.image_url;
    const long     = (s.caption || '').length > 300;
    const phone    = s.phone ? s.phone.replace(/\D/g, '') : null;

    const statusLabel = { pending: 'Pending', approved: 'Approved', revision: 'Needs Revision' };
    const statusClass = { pending: 'status-pending', approved: 'status-approved', revision: 'status-revision' };

    const approvedMsg  = encodeURIComponent(`Hey ${(s.ambassador_name||'').split(' ')[0]} — your post is approved! Go ahead and post it. 🔥 — Greek Empire`);
    const revisionMsg  = encodeURIComponent(`Hey ${(s.ambassador_name||'').split(' ')[0]} — we reviewed your post and need a few changes before you go live. Check your email or DM for feedback. — Greek Empire`);

    return `
    <div class="submission-card" data-id="${s.id}">
      <div class="card-header">
        <div class="card-meta">
          <div class="avatar">${initials}</div>
          <div class="card-info">
            <div class="ambassador-name">${esc(s.ambassador_name || 'Unknown')}</div>
            <div class="card-sub">${esc(s.instagram_handle || '')}${s.chapter ? ' · ' + esc(s.chapter) : ''}${s.college ? ' · ' + esc(s.college) : ''}${phone ? ' · ' + esc(s.phone) : ''}</div>
          </div>
        </div>
        <span class="platform-tag">${platform}</span>
        <span class="status-badge ${statusClass[s.status] || 'status-pending'}">${statusLabel[s.status] || s.status}</span>
      </div>

      <div class="card-body ${hasImg ? 'has-image' : ''}">
        ${hasImg ? `
        <div class="card-image">
          ${isVideo(s.image_url) ? `
          <div class="video-thumb">
            <span>🎬</span>
            <a href="${esc(s.image_url)}" target="_blank" download>Download Video</a>
          </div>` : `
          <img src="${esc(s.image_url)}" alt="Submitted content" loading="lazy" />
          `}
        </div>` : ''}
        <div class="card-content">
          <div class="caption-label">Draft Caption</div>
          <div class="caption-text ${long ? 'truncated' : ''}">${esc(s.caption || '—')}</div>
          ${long ? '<button class="expand-btn">Show full caption →</button>' : ''}
          ${s.notes ? `
          <div class="notes-block">
            <div class="notes-label">Ambassador Notes</div>
            <p>${esc(s.notes)}</p>
          </div>` : ''}
          ${s.revision_notes ? `
          <div class="notes-block" style="border-left-color: var(--red); margin-top:10px;">
            <div class="notes-label" style="color:var(--red);">Revision Feedback Sent</div>
            <p>${esc(s.revision_notes)}</p>
          </div>` : ''}
        </div>
      </div>

      <div class="card-actions">
        <span class="timestamp">${time}</span>
        ${phone ? `<a class="btn-text" href="sms:${phone}">💬 Text</a>` : ''}
        ${s.status !== 'approved' ? `<button class="btn btn-approve" data-id="${s.id}">✓ Approve</button>` : ''}
        ${s.status !== 'revision' ? `<button class="btn btn-revision" data-id="${s.id}">Request Revision</button>` : ''}
        <button class="btn-delete" data-id="${s.id}" title="Delete">🗑</button>
      </div>
    </div>`;
  }

  // ── Update status ──
  async function updateStatus(id, status, revision_notes = null) {
    const patch = { status };
    if (revision_notes) patch.revision_notes = revision_notes;

    try {
      const res = await fetch(
        `${SUPABASE_URL}/rest/v1/content_submissions?id=eq.${id}`,
        {
          method: 'PATCH',
          headers: {
            'Content-Type': 'application/json',
            'apikey': SUPABASE_ANON_KEY,
            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
            'Prefer': 'return=minimal'
          },
          body: JSON.stringify(patch)
        }
      );
      if (!res.ok) throw new Error(await res.text());

      // Update local state
      const idx = allSubmissions.findIndex(s => s.id === id);
      if (idx !== -1) {
        allSubmissions[idx].status = status;
        if (revision_notes) allSubmissions[idx].revision_notes = revision_notes;
      }
      updateBadges();
      renderList();
      toast(status === 'approved' ? '✓ Approved' : '↩ Revision requested');
    } catch (err) {
      console.error(err);
      toast('Error updating status — try again');
    }
  }

  // ── Delete submission ──
  async function deleteSubmission(id) {
    try {
      const res = await fetch(
        `${SUPABASE_URL}/rest/v1/content_submissions?id=eq.${id}`,
        {
          method: 'DELETE',
          headers: {
            'apikey': SUPABASE_ANON_KEY,
            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
          }
        }
      );
      if (!res.ok) throw new Error(await res.text());
      allSubmissions = allSubmissions.filter(s => s.id !== id);
      updateBadges();
      renderList();
      toast('Deleted');
    } catch (err) {
      console.error(err);
      toast('Error deleting');
    }
  }

  // ── Revision modal ──
  function openRevisionModal(id) {
    revisionTargetId = id;
    document.getElementById('revision-notes').value = '';
    document.getElementById('modal-overlay').classList.add('open');
    setTimeout(() => document.getElementById('revision-notes').focus(), 50);
  }

  document.getElementById('modal-cancel').addEventListener('click', () => {
    document.getElementById('modal-overlay').classList.remove('open');
    revisionTargetId = null;
  });

  document.getElementById('modal-overlay').addEventListener('click', e => {
    if (e.target === document.getElementById('modal-overlay')) {
      document.getElementById('modal-overlay').classList.remove('open');
      revisionTargetId = null;
    }
  });

  document.getElementById('modal-send').addEventListener('click', async () => {
    const notes = document.getElementById('revision-notes').value.trim();
    if (!notes) { document.getElementById('revision-notes').focus(); return; }
    document.getElementById('modal-overlay').classList.remove('open');
    await updateStatus(revisionTargetId, 'revision', notes);
    revisionTargetId = null;
  });

  // ── Helpers ──
  function esc(str) {
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function formatPlatform(p) {
    const map = { instagram_feed: 'IG Feed', instagram_reel: 'IG Reel', instagram_story: 'IG Story', tiktok: 'TikTok' };
    return map[p] || p || '—';
  }

  function formatTime(ts) {
    if (!ts) return '';
    const d = new Date(ts);
    const now = new Date();
    const diff = now - d;
    if (diff < 60000) return 'Just now';
    if (diff < 3600000) return `${Math.floor(diff/60000)}m ago`;
    if (diff < 86400000) return `${Math.floor(diff/3600000)}h ago`;
    return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
  }

  // ── Toast ──
  function toast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 2500);
  }
</script>
</body>
</html>
